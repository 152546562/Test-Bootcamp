<!DOCTYPE html>
<html lang = "en" > 
  <head>
    <meta charset = "UTF-8" />  
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0" />   
    <title> My Practice Page </title>
    <link rel = "icon" href = "favicon.ico" type = "image/x-icon" />    
  </head>
  <body>
    <!-- Main Heading -->
    <h1> Welcome to My Practice Page </h1>
 
    <!-- Introduction Paragraph with Text Formatting -->
    <p>
      This page is a practical exercise to learn HTML. I am
      <strong> excited </strong> to learn and <em> improve </em> my web development
      skills.
    </p>
 
    <!-- Blockquote with Citation -->
    <blockquote cite = "https://www.example.com" > 
      “The best way to predict the future is to invent it.”
    </blockquote>
    <cite> – Alan Kay </cite>
 
    <!-- Image with Attributes -->
    <img src = "https://picsum.photos/200/300" alt = "An example image" title = "Example Image" />    
 
    <!-- Anchor Tag for External Link -->
    <p>
      Visit my
      <a href = "https://www.example.com" target = "_blank" > favorite website </a> for  
      more learning resources.
    </p>
  </body>
</html>
